name: Publiceer tools

# Bij elke push naar main worden ENKEL de bestanden uit publish-list.txt
# naar de publieke repo Nestor-Group/tools gezet (GitHub Pages).
# De publieke repo krijgt telkens één nieuwe commit zonder geschiedenis.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publiceer
  cancel-in-progress: false

jobs:
  publiceer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publieke map opbouwen (enkel toegelaten bestanden)
        run: |
          mkdir out
          grep -vE '^\s*(#|$)' publish-list.txt | while read -r f; do
            [ -f "$f" ] || { echo "::error::$f staat in publish-list.txt maar bestaat niet"; exit 1; }
            cp "$f" out/
          done
          touch out/.nojekyll
          printf '# Nestor tools (gepubliceerd)\n\nAutomatisch gegenereerd vanuit een privé-repo. Niet rechtstreeks aanpassen.\n' > out/README.md
          ls -la out

      - name: Publiceren naar Nestor-Group/tools
        env:
          # Voorkeur: fine-grained token met enkel "Contents: read & write" op Nestor-Group/tools.
          PUBLISH_TOKEN: ${{ secrets.TOOLS_PUBLISH_TOKEN }}
          # Alternatief: deploy key met schrijfrecht op Nestor-Group/tools (als de organisatie dat toelaat).
          DEPLOY_KEY: ${{ secrets.TOOLS_DEPLOY_KEY }}
        run: |
          cd out
          git init -q -b main
          git config user.name "nestor-tools-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicatie $(date -u +%Y-%m-%dT%H:%MZ)"
          if [ -n "$PUBLISH_TOKEN" ]; then
            git push -f "https://x-access-token:${PUBLISH_TOKEN}@github.com/Nestor-Group/tools.git" main
          elif [ -n "$DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git push -f git@github.com:Nestor-Group/tools.git main
          else
            echo "::error::Geen secret TOOLS_PUBLISH_TOKEN of TOOLS_DEPLOY_KEY ingesteld"; exit 1
          fi
